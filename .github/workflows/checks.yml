name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The suite drives src/*.py --selftest subprocesses, which import the
      # plotting/analysis stack. Naming it here rather than installing all of
      # requirements.txt keeps torch and stable-baselines3 (never imported by
      # the tests) out of this job.
      - run: python -m pip install pytest numpy pandas matplotlib gymnasium
      - run: python -m pytest tests -q
