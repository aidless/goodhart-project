name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The suite drives src/*.py --selftest subprocesses, which import the
      # plotting/analysis stack (numpy, pandas, matplotlib, gymnasium, dotenv).
      # Take requirements.txt so a future dependency cannot silently break this
      # job again, but drop torch and stable-baselines3: only train_*.py imports
      # them and no test reaches those.
      - run: |
          python -m pip install --upgrade pip
          grep -viE '^(torch|stable-baselines3)' requirements.txt > "$RUNNER_TEMP/ci-requirements.txt"
          python -m pip install -r "$RUNNER_TEMP/ci-requirements.txt"
          python -m pip install pytest
      - run: python -m pytest tests -q
