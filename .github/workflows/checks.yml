name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-evidence:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # 这条 job 不训练。torch 与 stable-baselines3 只被
      # src/train_c2.py 和 src/train_q5.py 导入, 这里不安装。
      - name: install offline dependencies
        run: |
          python -m pip install --upgrade pip
          grep -viE '^(torch|stable-baselines3)' requirements.txt > "$RUNNER_TEMP/ci-requirements.txt"
          python -m pip install -r "$RUNNER_TEMP/ci-requirements.txt"
      - name: leak selftest, audit replay, summary recompute
        run: bash run_all.sh
